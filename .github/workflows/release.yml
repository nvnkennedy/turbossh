name: Release

# Tag-triggered publish to PyPI via Trusted Publishing (OIDC) — no token needed.
#
# One-time setup required before this works:
#   1. On PyPI: project 'turbossh' -> Settings -> Publishing -> add a GitHub
#      "pending publisher": owner=nvnkennedy, repo=turbossh,
#      workflow=release.yml, environment=pypi.
#   2. On GitHub: create an Environment named 'pypi' (Settings -> Environments).
#
# Then a release is just:  bump turbossh/__init__.py, commit, `git tag vX.Y.Z && git push --tags`.
# The Windows job rebuilds the bundled GUI exe so the published wheel matches the source.

on:
  push:
    tags: ["v*"]

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the bundled GUI exe
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]" pyinstaller
          python scripts/build_exe.py --onefile
          Copy-Item dist\turbossh-gui.exe turbossh\bin\turbossh-gui.exe -Force
      - uses: actions/upload-artifact@v4
        with:
          name: gui-exe
          path: turbossh/bin/turbossh-gui.exe

  build-dist:
    needs: build-exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore the built exe into the bundle
        uses: actions/download-artifact@v4
        with:
          name: gui-exe
          path: turbossh/bin/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build + check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build-dist
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A tag for a version that's already on PyPI (e.g. published manually)
          # skips quietly instead of failing the workflow.
          skip-existing: true

[build-system]
# >=77 for PEP 639 license expression + license-files support (used below).
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turbossh"
# single source of truth: turbossh/__init__.py __version__ (see tool.setuptools.dynamic)
dynamic = ["version"]
description = "SSH / serial / SFTP toolkit for automotive & embedded work — a Python library, a CLI, and a PyQt5 GUI with a real VT100 terminal. Native serial-over-RDP and offline OpenSSH install included."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TurboSSH contributors" }]
keywords = ["ssh", "sftp", "scp", "serial", "paramiko", "automation", "pyqt5",
            "testing", "embedded", "automotive", "qnx", "rdp", "winrm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Testing",
    "Topic :: Terminals :: Serial",
    "Intended Audience :: Developers",
]
dependencies = [
    "paramiko>=3.0",     # SSH / SFTP
    "scp>=0.14",         # SCP-protocol transfers
    "pyserial>=3.5",     # serial / COM-port handler
    "keyring>=23.0",     # confidential password storage (OS vault)
    "pywinrm>=0.4.3",    # WinRM bootstrap (enable sshd on Windows w/o SSH)
    "pyte>=0.8.1",       # VT100 emulation for the GUI terminal (htop/vim/top)
]

[project.urls]
Homepage = "https://nvnkennedy.github.io/turbossh/"
Repository = "https://github.com/nvnkennedy/turbossh"
Documentation = "https://github.com/nvnkennedy/turbossh#readme"
Changelog = "https://github.com/nvnkennedy/turbossh/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Only PyQt5 stays optional: it's a large GUI toolkit you only need when
# building a GUI, and forcing it would bloat headless/CI installs.
gui = ["PyQt5>=5.15"]
all = ["PyQt5>=5.15"]
test = ["pytest>=7.0"]       # the test suite (no network / device / display needed)

[project.scripts]
turbossh = "turbossh.cli:main"
turbossh-setup = "turbossh.cli:setup_server_main"
turbossh-docs = "turbossh.cli:open_docs"
turbossh-shortcut = "turbossh.cli:create_shortcut"

[project.gui-scripts]
turbossh-gui = "turbossh.cli:launch_gui"

[tool.setuptools]
packages = ["turbossh", "turbossh.gui"]

[tool.setuptools.dynamic]
version = { attr = "turbossh.__version__" }

[tool.setuptools.package-data]
turbossh = ["*.ps1", "*.md", "py.typed", "openssh/*.zip", "assets/*.ico",
            "assets/*.png", "bin/*.exe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# test_offline.py is the original stand-alone script (module-level asserts, and
# it switches logging off globally); it is run directly, not collected.
addopts = "--ignore=tests/test_offline.py"
# Paramiko's own server threads (the loopback test server) complain when a client
# hangs up mid-request, e.g. a cancelled transfer; that is the test working.
filterwarnings = ["ignore::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.ruff]
# Keep line length lenient — this codebase favours dense, commented lines.
line-length = 100
target-version = "py38"

[tool.ruff.lint]
# Pyflakes (real errors: unused imports/vars, bad f-strings) + a few safe pycodestyle
# checks. Deliberately conservative so it catches mistakes without churning style.
select = ["F", "E9", "W6"]

[tool.mypy]
# Informational only (run in CI as non-blocking). The package ships py.typed.
python_version = "3.8"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
exclude = "(^build/|^dist/)"
